[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-smart-vending"
version = "5.4.0"
description = "AI Smart Vending Machine - Model Service (Jetson Orin Nano TensorRT)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }

# =============================================================================
# Jetson Orin Nano (JetPack 6.2, Ubuntu 22.04) 전용
# =============================================================================
# 중요: torch, torchvision, opencv, tensorrt는 Jetson 시스템 패키지 사용
# uv venv --system-site-packages 옵션 필수!
dependencies = [
    # API Framework
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",

    # HTTP Client
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",

    # NumPy: 반드시 1.x (시스템 패키지 호환)
    "numpy>=1.24.0,<2.0.0",

    # Image Processing
    "pillow>=10.0.0",

    # YOLO (TensorRT 지원)
    "ultralytics>=8.0.0,<9.0.0",

    # Utilities
    "pyyaml>=6.0.0",
]

# =============================================================================
# Entry Points
# =============================================================================
[project.scripts]
model-service = "model_service.main:run"

[project.optional-dependencies]
# 개발 도구
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

# 테스트
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["services/model/model_service"]

[tool.hatch.build.targets.wheel.sources]
"services/model" = ""

[tool.hatch.build.targets.sdist]
include = [
    "services/model/model_service/**/*.py",
    "services/model/tests/**/*.py",
]

# =============================================================================
# UV Configuration (Jetson Orin Nano)
# =============================================================================
[tool.uv]
# Python version: controlled by [project] requires-python = ">=3.10,<3.12"
# System site packages: use `uv venv --system-site-packages` at venv creation time

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/model/tests"]
python_files = "test_*.py"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# =============================================================================
# Ruff Configuration
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
